services:
  - type: web
    name: subsmanager-manga
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:production
    preDeployCommand: pnpm run setup:production
    startCommand: pnpm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: subsmanager-job-auth
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subsmanager-manga-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_products,write_customers,write_products,write_purchase_options
      - key: CONTROL_ADMIN_EMAIL
        sync: false
      - key: CONTROL_ADMIN_PASSWORD
        sync: false
      - key: CONTROL_ADMIN_NAME
        value: SubsManager Owner
      - key: CONTROL_SESSION_SECRET
        generateValue: true
      - key: CONTROL_ENCRYPTION_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SUBSCRIPTION_EMAIL_FROM
        sync: false

  - type: cron
    name: subsmanager-manga-renewals
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    schedule: "*/10 * * * *"
    buildCommand: pnpm install --frozen-lockfile --prod
    startCommand: node scripts/run-renewals.mjs
    envVars:
      - fromGroup: subsmanager-job-auth
      - key: SHOPIFY_APP_URL
        sync: false

databases:
  - name: subsmanager-manga-db
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: subsmanager_manga
    user: subsmanager_manga
    ipAllowList: []

envVarGroups:
  - name: subsmanager-job-auth
    envVars:
      - key: JOB_SECRET
        generateValue: true
